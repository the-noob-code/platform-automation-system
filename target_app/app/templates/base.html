<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}MemberNet Legacy Portal{% endblock %}</title>
<style>
  body { font-family: "Times New Roman", Times, serif; background:#c0c0c0; font-size: 13px; margin:0; padding:0; }
  table.outer { width: 680px; margin: 40px auto; background:#d4d0c8; border: 2px outset #fff; border-collapse: collapse; }
  .titlebar { background:#000080; color:#fff; font-weight:bold; padding:4px 8px; font-size:14px; }
  .content { padding: 18px; background:#ece9d8; }
  table.navbar { border-collapse: collapse; margin-bottom: 8px; }
  table.navbar td { padding: 2px 14px 2px 0; }
  table.field-table { border-collapse: collapse; }
  table.field-table td { padding: 6px 8px; vertical-align: middle; }
  table.history-table { border-collapse: collapse; width: 100%; }
  table.history-table td { padding: 4px 10px; border-bottom: 1px solid #b0aa9a; }
  input[type=text], input[type=password] { font-family: "Times New Roman", Times, serif; font-size: 13px; border: 1px inset #808080; padding:3px; width: 170px; }
  select { font-family: "Times New Roman", Times, serif; font-size: 13px; }
  button.go-btn { font-family: "Times New Roman", Times, serif; font-weight:bold; padding: 3px 16px; border: 2px outset #fff; background:#d4d0c8; cursor:pointer; }
  button.go-btn:disabled { color:#888; cursor:default; }
  .err { color: #b00000; font-weight: bold; }
  .busy { color:#000080; font-style: italic; }
  .success { color: #006400; font-weight:bold; font-size:16px; }
  a { color:#0000ee; }
</style>
</head>
<body>
<table class="outer">
  <tr><td class="titlebar">MemberNet Enterprise :: Account Services v4.0</td></tr>
  <tr><td class="content">
    {% block nav %}{% endblock %}
    <table><tr><td>
      {% block content %}{% endblock %}
    </td></tr></table>
  </td></tr>
</table>
<script>
(function () {
  // Shared across every authenticated page — finds the logout button if
  // one is present on this screen and wires it up. No id/name/data-testid
  // needed: there's at most one on the page, matched by class.
  var logoutBtn = document.querySelector('.logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function (e) {
      e.preventDefault();
      fetch('/api/logout', { method: 'POST' })
        .then(function () { window.location.href = '/login'; })
        .catch(function () { window.location.href = '/login'; });
    });
  }
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
