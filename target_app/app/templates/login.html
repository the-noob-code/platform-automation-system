{% extends "base.html" %}
{% block title %}MemberNet :: Login{% endblock %}

{% block content %}
<table class="field-table">
  <tr><td colspan="3"><b>Member Login</b></td></tr>
  <tr>
    <td>Member ID:</td>
    <td><input type="text" placeholder="e.g. 1001" /></td>
    <td rowspan="2"><button class="go-btn">Log In</button></td>
  </tr>
  <tr>
    <td>PIN:</td>
    <td><input type="password" placeholder="4-digit PIN" /></td>
  </tr>
  <tr><td colspan="3"><span class="err" style="display:none"></span></td></tr>
</table>
{% endblock %}

{% block script %}
<script>
(function () {
  var table = document.querySelectorAll('table.field-table')[0];
  var inputs = table.querySelectorAll('input');
  var memberIdInput = inputs[0];
  var pinInput = inputs[1];
  var button = table.querySelector('button');
  var errSpan = table.querySelector('.err');

  function doLogin() {
    errSpan.style.display = 'none';
    errSpan.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        member_id: memberIdInput.value.trim(),
        pin: pinInput.value.trim()
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.status === 'ok') {
          window.location.href = data.redirect;
        } else {
          errSpan.textContent = data.message;
          errSpan.style.display = 'inline';
        }
      })
      .catch(function () {
        errSpan.textContent = 'Connection Error \u2014 Please Retry';
        errSpan.style.display = 'inline';
      });
  }

  button.addEventListener('click', function (e) {
    e.preventDefault();
    doLogin();
  });
  pinInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doLogin();
    }
  });
})();
</script>
{% endblock %}
